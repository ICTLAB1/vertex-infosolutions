# Build the storefront image, push it to Azure Container Registry, run the
# database migrations, then point the Web App at the new tag.
#
# Authentication is OIDC — the workflow exchanges a GitHub token for an Azure
# one at run time, so there is no long-lived credential in the repository.
# Configure once:
#
#   az ad app create --display-name vertex-deploy
#   az role assignment create --role Contributor --assignee <appId> \
#     --scope /subscriptions/<sub>/resourceGroups/rg-vertex-prod
#   # then add a federated credential for this repo's main branch
#
# Repository secrets required:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Repository variables required:
#   AZURE_RESOURCE_GROUP, AZURE_REGISTRY, AZURE_WEBAPP_NAME
#
# The migration step needs DATABASE_URL as a secret, because a migration runs
# from CI rather than from the container at boot — a container that migrates on
# startup races itself the moment App Service runs two instances.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: vertex-storefront

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The build must pass without a database. Every route is dynamic, so it
      # does; if that ever stops being true this step catches it here rather
      # than in the image build.
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name ${{ vars.AZURE_REGISTRY }}

      - name: Build and push the image
        run: |
          REGISTRY="${{ vars.AZURE_REGISTRY }}.azurecr.io"
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            .
          docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          docker push "$REGISTRY/$IMAGE_NAME:latest"

      # Migrations run before the new image is live, so the schema is always at
      # least as new as the code reading it. Every migration therefore has to be
      # backwards compatible with the version still serving traffic — add a
      # column before writing to it, drop one a release later.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Point the Web App at the new image
        run: |
          az webapp config container set \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --container-image-name "${{ vars.AZURE_REGISTRY }}.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            --container-registry-url "https://${{ vars.AZURE_REGISTRY }}.azurecr.io"

      - name: Wait for the health check to pass
        run: |
          URL="https://$(az webapp show \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query defaultHostName -o tsv)/api/health"
          echo "Probing $URL"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after $attempt attempts."
              exit 0
            fi
            echo "  attempt $attempt: HTTP $code"
            sleep 10
          done
          echo "Health check never returned 200 — the deploy is live but unhealthy."
          exit 1
