<!--
  The Microsoft mark, for listings whose product has no icon of its own.

  Four squares in Microsoft's own colours, at the proportions of the published
  mark: each square is 10 units on a 23-unit grid, with a 3-unit gap. Drawn
  rather than copied because the shape is four rectangles, and a drawing scales
  to any size on the page without a second file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23" role="img" aria-label="Microsoft">
  <rect width="10" height="10" x="0" y="0" fill="#F25022"/>
  <rect width="10" height="10" x="13" y="0" fill="#7FBA00"/>
  <rect width="10" height="10" x="0" y="13" fill="#00A4EF"/>
  <rect width="10" height="10" x="13" y="13" fill="#FFB900"/>
</svg>
